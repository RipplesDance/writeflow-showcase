name: Showcase verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned tools
        run: npm ci --no-audit --no-fund
      - name: Run SQLite-backed API and stream tests
        run: npm run test:all
      - name: Build Cloudflare Pages Functions
        run: npx wrangler pages functions build functions --outdir=.wrangler-pages-build
